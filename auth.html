<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080914">
<title>تسجيل الدخول | LF BOTS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080914;--panel:#111329;--line:#2a2d4b;--green:#00f5ad;--purple:#9a6bff;--muted:#aeb3cd}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Tajawal,sans-serif;color:#f8f8ff;background:radial-gradient(ellipse at 80% 10%,#30205c 0,transparent 38%),radial-gradient(ellipse at 10% 90%,#063c39 0,transparent 30%),var(--bg)}a{color:var(--green);text-decoration:none}.card{width:min(480px,100%);padding:clamp(22px,5vw,38px);background:#111329eF;border:1px solid #ffffff1c;border-radius:24px;box-shadow:0 25px 90px #0008}.brand{display:flex;align-items:center;gap:11px;font-size:1.35rem;font-weight:900}.logo{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--green);border-radius:13px;color:var(--green)}.eyebrow{color:var(--green);font-weight:800;letter-spacing:1.4px;font-size:.82rem;margin-top:28px}h1{font-size:2.2rem;margin:7px 0}p{color:var(--muted);line-height:1.8}.field{margin-top:18px}label{display:block;margin-bottom:8px;font-weight:700}input{width:100%;min-height:52px;background:#080b18;border:1px solid var(--line);border-radius:12px;color:white;padding:12px 14px;font:inherit;outline:none}input:focus{border-color:var(--green);box-shadow:0 0 0 3px #00f5ad15}.btn{width:100%;min-height:52px;margin-top:18px;border:0;border-radius:12px;background:linear-gradient(120deg,var(--green),#6cffd1);color:#06140f;font:inherit;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.secondary{background:#ffffff08;color:#f4f4ff;border:1px solid var(--line)}.status{min-height:28px;margin-top:14px;color:#c9cbe0;line-height:1.6;overflow-wrap:anywhere}.status.bad{color:#ffaaa9}.hidden{display:none!important}.links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px;font-size:.95rem}.tiny{font-size:.85rem}.api-state{display:inline-flex;align-items:center;gap:7px;font-size:.85rem;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:#f2bb55}.dot.ok{background:var(--green)}
</style>
<script defer src="auth.js"></script></head><body><main class="card">
<a class="brand" href="index.html"><span class="logo">LF</span><span>LF <span style="color:var(--green)">BOTS</span></span></a>
<div class="eyebrow">SECURE WHATSAPP SIGN-IN</div><h1>دخولك يبدأ برقمك</h1><p>أدخل رقم واتساب بصيغته الدولية. سنطلب من سيرفر LF BOTS إرسال رمز تحقق مؤقت، ثم نتحقق منه قبل المتابعة.</p>
<div class="api-state"><span id="apiDot" class="dot"></span><span id="apiState">لم يتم فحص اتصال السيرفر بعد</span></div>
<form id="phoneForm"><div class="field"><label for="phone">رقم الهاتف بالصيغة الدولية</label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="مثال: +9665XXXXXXXX" required></div><button class="btn" id="sendBtn" type="submit">إرسال رمز التحقق</button></form>
<form id="otpForm" class="hidden"><div class="field"><label for="otp">رمز التحقق الذي وصلك عبر واتساب</label><input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4,8}" minlength="4" maxlength="8" placeholder="أدخل الرمز" required></div><button class="btn" id="verifyBtn" type="submit">تحقق وتابع إلى المتجر</button><button class="btn secondary" id="backBtn" type="button">تغيير رقم الهاتف</button></form>
<div id="status" class="status" role="status" aria-live="polite"></div><div class="links"><a href="store.html">تصفح المتجر بدون تسجيل</a><a href="index.html">الصفحة الرئيسية</a></div><p class="tiny">لا تشارك رمز التحقق مع أي شخص. لن نطلب منك كلمة مرور واتساب.</p>
</main></body></html>
