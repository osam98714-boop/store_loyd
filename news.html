<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أخبار LF BOTS</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="lf-new-features.css"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"></head><body><main class="wrap lf-page"><a class="btn btn-outline" href="index.html">العودة للمتجر</a><header class="lf-page-head"><span class="eyebrow">آخر المستجدات</span><h1>أخبار وتحديثات LF BOTS</h1><p>إعلانات الإصدارات والعروض والأعمال الجديدة.</p></header><div id="items" class="lf-content-grid">جارٍ تحميل الأخبار...</div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/content?kind=news').then(r=>r.json()).then(d=>{const a=(d.items||[]).sort((x,y)=>String(y.createdAt||'').localeCompare(String(x.createdAt||'')));document.querySelector('#items').innerHTML=a.length?a.map(x=>`<article class="lf-content-card"><small>${x.createdAt?new Date(x.createdAt).toLocaleDateString('ar-SA'):''}</small><h2>${esc(x.title)}</h2><p>${esc(x.body||x.description||'')}</p>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">التفاصيل</a>`:''}</article>`).join(''):'لا توجد أخبار منشورة حاليًا.'}).catch(()=>document.querySelector('#items').textContent='تعذر تحميل الأخبار.');</script></main></body></html>
