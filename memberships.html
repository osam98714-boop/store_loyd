<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عضويات LF BOTS</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="lf-new-features.css"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"></head><body><main class="wrap lf-page"><a class="btn btn-outline" href="index.html">العودة للمتجر</a><header class="lf-page-head"><span class="eyebrow">مكافآت العملاء</span><h1>مستويات العضوية</h1><p>المستوى يعتمد على رصيد نقاط حساب LF. سجّل الدخول من صفحة حسابي لمراجعة رصيدك.</p></header><div id="tiers" class="lf-content-grid"></div><div class="lf-content-card" id="account-status">جارٍ قراءة مستوى العضوية...</div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tiers=[];(async()=>{try{const r=await fetch('/api/content?kind=memberships',{cache:'no-store'}),d=await r.json();tiers=(d.items||[]).filter(x=>x.active!==false).sort((a,b)=>Number(a.minPoints||a.points||0)-Number(b.minPoints||b.points||0));document.querySelector('#tiers').innerHTML=tiers.length?tiers.map((t,i)=>`<article class="lf-content-card tier tier-${i%4}"><span class="offer-label">المستوى ${i+1}</span><h2>${esc(t.title||t.name)}</h2><strong>${Number(t.minPoints||t.points||0).toLocaleString('ar-SA')} نقطة فأكثر</strong><p>${esc(t.body||t.description||'')}</p></article>`).join(''):'لا توجد مستويات عضوية منشورة حاليًا.';}catch{document.querySelector('#tiers').textContent='تعذر تحميل مستويات العضوية.'}const token=sessionStorage.getItem('lf_account_token')||'';if(!token){document.querySelector('#account-status').innerHTML='سجّل الدخول من <a href="account.html">صفحة حسابي</a> لمراجعة نقاطك.';return;}try{const r=await fetch('/api/account',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'me'})}),d=await r.json();if(!r.ok)throw Error();const points=Number(d.user?.points||0),tier=[...tiers].reverse().find(t=>points>=Number(t.minPoints||t.points||0));document.querySelector('#account-status').innerHTML=`<h2>${tier?'مستواك الحالي: '+esc(tier.title||tier.name):'لم تصل إلى مستوى بعد'}</h2><p>رصيدك: <strong>${points.toLocaleString('ar-SA')} نقطة</strong></p>`;}catch{document.querySelector('#account-status').textContent='تعذر التحقق من الحساب. افتح صفحة حسابي وسجّل الدخول مجددًا.'}})();</script></main></body></html>
