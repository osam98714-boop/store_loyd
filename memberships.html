<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عضويات LF BOTS</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="lf-new-features.css"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"></head><body><main class="wrap lf-page"><a class="btn btn-outline" href="index.html">العودة للمتجر</a><header class="lf-page-head"><span class="eyebrow">مكافآت العملاء</span><h1>مستويات العضوية</h1><p>المستوى يعتمد على رصيد نقاط حساب LF. سجّل الدخول من صفحة حسابي لمراجعة رصيدك.</p></header><div id="tiers" class="lf-content-grid"></div><div class="lf-content-card" id="account-status">جارٍ قراءة مستوى العضوية...</div><script>const tiers=[{name:'برونزي',min:0,desc:'الانطلاقة في مجتمع LF BOTS'},{name:'فضي',min:1000,desc:'لأعضاء المجتمع النشطين'},{name:'ذهبي',min:5000,desc:'لأصحاب الرصيد المميز'},{name:'بلاتيني',min:15000,desc:'أعلى مستوى عضوية'}];document.querySelector('#tiers').innerHTML=tiers.map((t,i)=>`<article class="lf-content-card tier tier-${i}"><span class="offer-label">المستوى ${i+1}</span><h2>${t.name}</h2><strong>${t.min.toLocaleString('ar-SA')} نقطة فأكثر</strong><p>${t.desc}</p></article>`).join('');(async()=>{const token=sessionStorage.getItem('lf_account_token')||'';if(!token){document.querySelector('#account-status').innerHTML='لم نعثر على جلسة حساب محفوظة في هذا المتصفح. <a href="account.html">افتح حسابي وسجّل الدخول</a>.';return;}try{const r=await fetch('/api/account',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'me'})});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر التحقق');const points=Number(d.user?.points||0),tier=[...tiers].reverse().find(t=>points>=t.min);document.querySelector('#account-status').innerHTML=`<h2>مستواك الحالي: ${tier.name}</h2><p>رصيدك: <strong>${points.toLocaleString('ar-SA')} نقطة</strong></p><p>هذه مستويات تقديرية مبنية على النقاط الحالية وليست اشتراكًا مدفوعًا.</p>`;}catch(e){document.querySelector('#account-status').textContent='تعذر التحقق من الحساب. افتح صفحة حسابي وسجّل الدخول مجددًا.'}})();</script></main></body></html>
