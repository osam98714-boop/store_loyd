<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تنبيهات LF BOTS</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="lf-new-features.css"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"></head><body><main class="wrap lf-page"><a class="btn btn-outline" href="index.html">العودة للمتجر</a><header class="lf-page-head"><span class="eyebrow">ابقَ على اطلاع</span><h1>الإشعارات والتنبيهات</h1><p>الإعلانات العامة التي ينشرها فريق المتجر.</p></header><div id="items" class="lf-content-grid">جارٍ تحميل التنبيهات...</div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/content?kind=notifications').then(r=>r.json()).then(d=>{const a=(d.items||[]).sort((x,y)=>String(y.createdAt||'').localeCompare(String(x.createdAt||'')));document.querySelector('#items').innerHTML=a.length?a.map(x=>`<article class="lf-content-card"><span class="offer-label">${esc(x.level||'تنبيه')}</span><h2>${esc(x.title)}</h2><p>${esc(x.body||x.message||'')}</p><small>${x.createdAt?new Date(x.createdAt).toLocaleString('ar-SA'):''}</small></article>`).join(''):'لا توجد تنبيهات جديدة.'}).catch(()=>document.querySelector('#items').textContent='تعذر تحميل التنبيهات.');</script></main></body></html>
