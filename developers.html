<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المطورون | LF BOTS</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="lf-new-features.css"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"></head><body><main class="wrap lf-page"><a class="btn btn-outline" href="index.html">العودة للمتجر</a><header class="lf-page-head"><span class="eyebrow">مجتمع المطورين</span><h1>مطورون ومساهمون</h1><p>تعرف على المطورين والمساهمين المعتمدين في مشاريع LF BOTS.</p></header><div id="items" class="lf-content-grid">جارٍ التحميل...</div><p id="empty"></p><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/content?kind=developers').then(r=>r.json()).then(d=>{let a=d.items||[];document.querySelector('#items').innerHTML=a.map(x=>`<article class="lf-content-card"><h2>${esc(x.name||x.title)}</h2><p>${esc(x.bio||x.description||'مساهم في مشاريع البرمجة.')}</p><p>${esc(x.skills||'')}</p>${x.url?`<a rel="noopener" target="_blank" href="${esc(x.url)}">الملف أو الأعمال</a>`:''}</article>`).join('');if(!a.length)document.querySelector('#empty').textContent='لا توجد ملفات مطورين منشورة حتى الآن.'}).catch(()=>document.querySelector('#items').textContent='تعذر تحميل قائمة المطورين.');</script></main></body></html>
