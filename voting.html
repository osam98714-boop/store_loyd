<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التصويت على البوتات القادمة | LF BOTS</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="feature-pages.css"><link rel="stylesheet" href="lf-new-features.css"></head><body><main class="lf-voting-page"><a class="btn btn-outline" href="index.html">← العودة للمتجر</a><header><span class="eyebrow">شارك في اختيار القادم</span><h1>صوّت على البوتات القادمة</h1><p>تحتاج إلى تسجيل الدخول بحساب LF للتصويت. لكل حساب صوت واحد لكل فكرة.</p><a class="btn btn-primary" href="account.html">تسجيل الدخول / إنشاء حساب</a></header><div id="voting-list" class="lf-voting-grid"><p>جارٍ تحميل الأفكار...</p></div><p id="voting-message" role="status"></p></main><script>
const box=document.getElementById('voting-list'),msg=document.getElementById('voting-message');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/voting',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'تعذر التحميل');box.innerHTML=(d.ideas||[]).map(i=>`<article class="lf-vote-card"><span class="vote-status">${esc(i.status||'قيد الدراسة')}</span><h2>${esc(i.name)}</h2><p>${esc(i.description)}</p><div class="vote-bottom"><b>🗳️ ${Number(i.votes)||0} صوت</b><button class="btn btn-primary" data-vote="${esc(i.id)}">صوّت الآن</button></div></article>`).join('')||'<p>لا توجد أفكار للتصويت الآن.</p>';box.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>vote(b.dataset.vote,b));}catch(e){box.innerHTML='<p>تعذر تحميل التصويت. تأكد من نشر ملفات API على Vercel.</p>';}}
async function vote(id,b){const token=sessionStorage.getItem('lf_account_token');if(!token){msg.textContent='سجّل الدخول إلى حسابك أولًا، ثم ارجع إلى هذه الصفحة.';return;}b.disabled=true;try{const r=await fetch('/api/voting',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({ideaId:id})}),d=await r.json();if(!r.ok)throw Error(d.error||'تعذر التصويت');msg.textContent=d.message||'تم التصويت';await load();}catch(e){msg.textContent=e.message;}finally{b.disabled=false;}}
load();
</script></body></html>
