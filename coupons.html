<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>العروض والكوبونات | LF BOTS</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="lf-new-features.css"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"></head><body><main class="wrap lf-page"><a class="btn btn-outline" href="index.html">العودة للمتجر</a><header class="lf-page-head"><span class="eyebrow">وفر على طلبك</span><h1>العروض وكوبونات الخصم</h1><p>الكوبونات النشطة فقط تظهر هنا، ويعاد التحقق منها على الخادم عند الطلب.</p></header><div id="items" class="lf-offers-grid">جارٍ تحميل العروض...</div><p id="msg" role="status"></p></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/coupons').then(r=>r.json()).then(d=>{const a=d.coupons||[];document.querySelector('#items').innerHTML=a.length?a.map((c,i)=>`<article class="lf-offer-card offer-tone-${i%4}"><span class="offer-label">عرض LF BOTS</span><h2>${esc(c.code)}</h2><strong>${c.type==='fixed'?('$'+Number(c.value).toFixed(2)):(Number(c.value)+'%')} خصم</strong><p>${c.expiresAt?'ينتهي: '+new Date(c.expiresAt).toLocaleDateString('ar-SA'):'لفترة محدودة حسب توفر العرض'}</p><button class="btn btn-primary" onclick="navigator.clipboard.writeText('${esc(c.code)}').then(()=>document.querySelector('#msg').textContent='تم نسخ الكوبون')">نسخ الكوبون</button></article>`).join(''):'<p>لا توجد عروض نشطة حاليًا. تابعنا قريبًا!</p>';}).catch(()=>document.querySelector('#items').textContent='تعذر تحميل العروض. حاول مرة أخرى لاحقًا.');</script></body></html>
