<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إحصائيات LF BOTS</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="lf-new-features.css"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"></head><body><main class="wrap lf-page"><a class="btn btn-outline" href="admin.html">العودة للوحة الإدارة</a><header class="lf-page-head"><span class="eyebrow">للمدير فقط</span><h1>إحصائيات المتجر</h1><p>تعرض هذه الصفحة بيانات الخادم، وتتطلب كلمة مرور الإدارة.</p></header><form id="login" class="lf-content-card"><label>كلمة مرور الإدارة <input id="pass" type="password" required autocomplete="current-password"></label><button class="btn btn-primary">عرض الإحصائيات</button></form><div id="stats" class="lf-content-grid"></div><p id="msg" role="status"></p><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/stats',{headers:{'x-admin-password':document.querySelector('#pass').value}}),d=await r.json();if(!r.ok){document.querySelector('#msg').textContent=d.error||'تعذر التحميل';return;}document.querySelector('#stats').innerHTML=[['المنتجات',d.products],['كل الطلبات',d.orders],['بانتظار الدفع',d.pending],['الطلبات المدفوعة',d.paid],['العملاء',d.customers],['أصوات التصويت',d.votes],['الكوبونات',d.coupons],['الإيراد المؤكد (USD)',Number(d.confirmedRevenueUSD||0).toFixed(2)]].map(([k,v])=>`<article class="lf-content-card"><p>${k}</p><h2>${Number(v||0).toLocaleString('ar-SA')}</h2></article>`).join('');document.querySelector('#msg').textContent=d.note||'تم تحميل الإحصائيات.'};</script></main></body></html>
