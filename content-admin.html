<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة محتوى LF BOTS</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="lf-new-features.css"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"></head><body><main class="wrap lf-page"><a class="btn btn-outline" href="admin.html">العودة للوحة الإدارة</a><header class="lf-page-head"><h1>إدارة محتوى المتجر</h1><p>أضف الأخبار والتنبيهات والمطورين وبطاقات الهدايا. الحفظ يتم في ملفات JSON على GitHub.</p></header><section class="lf-content-card"><form id="login"><label>كلمة مرور المدير<input id="pass" type="password" required autocomplete="current-password"></label><button class="btn btn-primary">تأكيد كلمة المرور</button></form><p id="status" role="status"></p></section><section class="lf-content-card"><form id="add"><label>نوع المحتوى<select id="kind"><option value="news">خبر / تحديث</option><option value="notifications">تنبيه عام</option><option value="developers">مطور</option><option value="giftcards">بطاقة هدية</option><option value="memberships">خطة عضوية (عرض تعريفي)</option></select></label><label>العنوان / الاسم<input id="title" required maxlength="100"></label><label>الوصف / الرسالة<textarea id="body" rows="3" maxlength="2000"></textarea></label><label>قيمة البطاقة / السعر (اختياري)<input id="value" maxlength="80"></label><label>رابط خارجي اختياري<input id="url" type="url" maxlength="500"></label><button class="btn btn-primary">إضافة ونشر</button></form></section><section><h2>المحتوى الحالي</h2><div id="items" class="lf-content-grid"></div></section><script>let pass='';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function call(kind,method='GET',body){const r=await fetch('/api/content?kind='+encodeURIComponent(kind),{method,headers:{'Content-Type':'application/json','x-admin-password':pass},body:body?JSON.stringify(body):undefined}),d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تنفيذ العملية');return d}async function load(){const kinds=['news','notifications','developers','giftcards','memberships'];let out='';for(const k of kinds){try{const d=await call(k);out+=(d.items||[]).map(x=>`<article class="lf-content-card"><small>${k}</small><h3>${esc(x.title||x.name)}</h3><p>${esc(x.body||x.description||x.bio||'')}</p><p>الحالة: ${x.active===false?'متوقف':'نشط'}</p><button class="btn btn-outline" data-toggle="${k}" data-id="${esc(x.id)}" data-active="${x.active===false?'1':'0'}">${x.active===false?'تفعيل':'إيقاف'}</button><button class="btn btn-outline" data-del="${k}" data-id="${esc(x.id)}">حذف</button></article>`).join('')}catch(e){$('#status').textContent=e.message;return}}$('#items').innerHTML=out||'لا يوجد محتوى بعد.';$('#items').querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{try{await call(b.dataset.toggle,'PATCH',{id:b.dataset.id,patch:{active:b.dataset.active==='1'}});await load()}catch(e){$('#status').textContent=e.message}});$('#items').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('حذف العنصر؟'))return;try{await call(b.dataset.del,'DELETE',{id:b.dataset.id});await load()}catch(e){$('#status').textContent=e.message}})}$('#login').onsubmit=async e=>{e.preventDefault();pass=$('#pass').value;try{const r=await fetch('/api/admin-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:prompt('أدخل اسم المدير المسجل في ADMIN_USER'),password:pass})});if(!r.ok)throw Error('بيانات المدير غير صحيحة');$('#status').textContent='تم التحقق. يمكنك إدارة المحتوى.';await load()}catch(err){$('#status').textContent=err.message}};$('#add').onsubmit=async e=>{e.preventDefault();if(!pass){$('#status').textContent='أكد كلمة مرور المدير أولًا.';return}const kind=$('#kind').value,title=$('#title').value.trim(),body=$('#body').value.trim(),value=$('#value').value.trim(),url=$('#url').value.trim();const item={title,name:title,body,description:body,bio:body,value,price:value,url,active:true};try{await call(kind,'POST',{item});e.target.reset();$('#status').textContent='تم حفظ المحتوى في GitHub.';await load()}catch(err){$('#status').textContent=err.message}};</script></main></body></html>
