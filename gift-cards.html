<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بطاقات الهدايا | LF BOTS</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="lf-new-features.css"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"></head><body><main class="wrap lf-page"><a class="btn btn-outline" href="index.html">العودة للمتجر</a><header class="lf-page-head"><span class="eyebrow">هدية للمبرمجين</span><h1>بطاقات هدايا LF BOTS</h1><p>اختر قيمة البطاقة واطلبها يدويًا عبر واتساب. لا يتم إصدار رمز أو خصم تلقائي إلا بعد تأكيد الطلب من الإدارة.</p></header><div id="items" class="lf-content-grid">جارٍ تحميل البطاقات...</div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/content?kind=giftcards').then(r=>r.json()).then(d=>{const a=d.items||[];document.querySelector('#items').innerHTML=a.length?a.map(x=>`<article class="lf-content-card gift-card"><span class="offer-label">بطاقة هدية</span><h2>${esc(x.title||x.name)}</h2><strong>${esc(x.value||x.price||'حسب الاختيار')}</strong><p>${esc(x.description||'هدية رقمية من LF BOTS.')}</p><a class="btn btn-primary" target="_blank" rel="noopener" href="https://wa.me/962771111377?text=${encodeURIComponent('أرغب بطلب بطاقة هدية: '+(x.title||x.name)+' ('+(x.value||x.price||'')+')')}">اطلب عبر واتساب</a></article>`).join(''):'لا توجد بطاقات معروضة الآن. يمكن للإدارة إضافة البطاقات من خلال واجهة إدارة المحتوى في API.'}).catch(()=>document.querySelector('#items').textContent='تعذر تحميل البطاقات.');</script></main></body></html>
